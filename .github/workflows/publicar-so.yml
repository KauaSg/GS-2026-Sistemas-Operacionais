name: Publicar scripts de SO
on:
  push:
    branches: [main]
    paths:
      - 'pacote/parte-06.b64'
      - '.github/workflows/publicar-so.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruir pacote e extrair arquivos verificáveis
        shell: bash
        run: |
          set -euo pipefail
          cat pacote/parte-0{1,2,3,4,5,6}.b64 | base64 --decode > /tmp/so.tar.bz2
          mkdir -p /tmp/so-extrair
          tar -xjf /tmp/so.tar.bz2 -C /tmp/so-extrair
          cp -r /tmp/so-extrair/so ./so
          test -f so/scripts/00_instalar_tudo.sh
          test -f so/scripts/08_testar_falha_monitor.sh
          find so/scripts so/testes -name '*.sh' -exec bash -n {} \;
          echo "Arquivos extraídos:"
          find so -type f | sort
      - name: Publicar scripts no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add so/
          if git diff --cached --quiet; then
            echo "Sem mudanças pendentes"
          else
            git commit -m "feat: publica scripts Linux, systemd, auditoria e testes de falha"
            git push
          fi
