name: Publicar evidências reais da VM Ubuntu
on:
  push:
    branches: [main]
    paths:
      - 'pacote-evidencias/parte-03.b64'
      - '.github/workflows/publicar-evidencias.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruir pacote das cinco evidências reais
        shell: bash
        run: |
          set -euo pipefail
          cat pacote-evidencias/parte-0{1,2,3}.b64 | base64 --decode > /tmp/evidencias_SO.tar.gz
          echo "7c46fbc21f0a6ea2e2071f6f4af8e3384964210dc8357cdb115f17e45e645598  /tmp/evidencias_SO.tar.gz" | sha256sum -c -
          mkdir -p so/evidencias
          tar -tzf /tmp/evidencias_SO.tar.gz
          tar -xzf /tmp/evidencias_SO.tar.gz -C so/evidencias
          test -s so/evidencias/execucao/01_rede.txt
          test -s so/evidencias/execucao/02_aplicacao.txt
          test -s so/evidencias/execucao/03_systemd.txt
          test -s so/evidencias/execucao/04_logs.txt
          test -s so/evidencias/execucao/05_journal.txt
      - name: Versionar evidências
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add so/evidencias/execucao/
          if ! git diff --cached --quiet; then
            git commit -m "docs: publica cinco relatórios reais de execução da VM Ubuntu"
            git push
          fi
